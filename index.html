<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Lending Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="lt-body">
  <header class="lt-header">
    <div class="lt-container">
      <h1 class="lt-title">Book Lending Tracker</h1>
      <p class="lt-subtitle">Keep track of who has your books and when they are due back.</p>
    </div>
  </header>

  <main class="lt-container">
    <section class="lt-grid lt-grid-2" aria-label="Summary">
      <div class="lt-card lt-stat">
        <span class="lt-stat-label">Total loans</span>
        <span class="lt-stat-value" id="totalLoans">0</span>
      </div>
      <div class="lt-card lt-stat lt-stat-danger">
        <span class="lt-stat-label">Overdue loans</span>
        <span class="lt-stat-value" id="overdueLoans">0</span>
      </div>
    </section>

    <section class="lt-card">
      <h2 class="lt-card-title">Lend a book</h2>
      <form id="loanForm" class="lt-form" novalidate>
        <div class="lt-grid lt-grid-3">
          <div class="lt-field">
            <label class="lt-label" for="title">Title</label>
            <input class="lt-input" type="text" id="title" name="title" required>
            <span class="lt-error" id="titleError"></span>
          </div>
          <div class="lt-field">
            <label class="lt-label" for="author">Author</label>
            <input class="lt-input" type="text" id="author" name="author" required>
            <span class="lt-error" id="authorError"></span>
          </div>
          <div class="lt-field">
            <label class="lt-label" for="borrower">Borrower</label>
            <input class="lt-input" type="text" id="borrower" name="borrower" required>
            <span class="lt-error" id="borrowerError"></span>
          </div>
          <div class="lt-field">
            <label class="lt-label" for="dueDate">Due date</label>
            <input class="lt-input" type="date" id="dueDate" name="dueDate" required>
            <span class="lt-error" id="dueDateError"></span>
          </div>
          <div class="lt-field">
            <label class="lt-label" for="genre">Genre</label>
            <input class="lt-input" type="text" id="genre" name="genre" required>
            <span class="lt-error" id="genreError"></span>
          </div>
        </div>
        <button class="lt-btn lt-btn-primary" type="submit">Add loan</button>
      </form>
    </section>

    <section class="lt-card">
      <h2 class="lt-card-title">Loans</h2>
      <div class="lt-table-wrap">
        <table class="lt-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Borrower</th>
              <th>Due date</th>
              <th>Genre</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="loanTableBody"></tbody>
        </table>
      </div>
      <p class="lt-empty" id="emptyMessage">No loans yet. Add your first one above.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
